<style>

.header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:13px}.brand{display:flex;gap:14px;align-items:center}.logo{width:62px;height:62px;border-radius:20px;display:grid;place-items:center;font-size:36px;background:linear-gradient(135deg,#2d6e80,#17415f);box-shadow:0 9px 30px #0005;border:1px solid #73c4d05e}.eyebrow{font-size:13px;letter-spacing:.19em;font-weight:850;color:#80d7d1}.header h1{font-size:clamp(24px,2.25vw,37px);margin:3px 0;line-height:1.3;letter-spacing:.025em}.header p{margin:2px 0;color:var(--muted);font-size:15px}.header-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}

.player-heading{background:#ffffff0a;border-bottom:1px solid #ffffff24;display:flex;justify-content:space-between;align-items:center;padding:15px 19px;gap:12px}.name-block{display:flex;align-items:center;gap:12px}.avatar{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--accent);color:#0a2532;font-weight:1000;font-size:29px}.player-heading h3{margin:0;font-size:25px}.player-sub{font-size:13px;font-weight:700;letter-spacing:.05em;color:var(--muted);margin-top:2px}.status{font-size:13px;font-weight:900;color:var(--accent);background:#ffffff12;border:1px solid #ffffff1a;padding:7px 10px;border-radius:99px;white-space:nowrap}
.player-content{padding:19px 22px;display:flex;flex-direction:column;gap:14px;flex:1}.clue{padding:17px 17px 16px;background:#0619289e;border-radius:17px;border:1px solid #ffffff25;border-left:5px solid var(--accent);min-height:102px}.label{font-size:14px;color:var(--accent);letter-spacing:.07em;font-weight:900;display:block;margin-bottom:8px}.clue p{font-size:clamp(19px,1.75vw,25px);font-weight:700;line-height:1.6;margin:0;white-space:pre-wrap}.question{font-weight:900;font-size:clamp(20px,1.9vw,28px);line-height:1.48;margin:4px 0 3px;white-space:pre-wrap}.answers{display:grid;gap:9px}.choice{width:100%;text-align:left;white-space:normal;color:#f6fbff;background:#ffffff08;border:2px solid #ffffff38;border-radius:14px;min-height:52px;padding:11px 14px;font-size:clamp(17px,1.35vw,21px);font-weight:750}.choice:hover:not(:disabled){background:#ffffff18}.choice.selected{background:#6ce3cf24;border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}.choice:before{content:attr(data-letter);display:inline-grid;place-items:center;width:29px;height:29px;border-radius:9px;background:#ffffff12;color:var(--accent);margin-right:12px;font-weight:1000}.input-answer{width:100%;padding:14px 16px;background:#eaf4fe;color:#0b2338;border:3px solid transparent;border-radius:13px;font-size:23px;font-weight:800}.input-answer::placeholder{color:#648296}.answer-actions{display:flex;align-items:center;gap:11px;margin-top:auto;flex-wrap:wrap}.answer-actions .btn.primary{font-size:18px;padding:13px 25px}.answer-actions .btn.ghost{font-size:15px}.feedback{min-height:26px;font-weight:850;font-size:16px;color:#f6d48f}.feedback.ok{color:var(--good)}.feedback.bad{color:#ffb9ac}.hint-stack{display:grid;gap:10px}.hint{background:#fff0c6;color:#493819;border:2px solid #ffce72;border-radius:13px;padding:13px 16px;font-weight:800;line-height:1.55;font-size:clamp(16px,1.3vw,20px);box-shadow:0 5px 12px #0002}.hint small{display:block;font-size:12px;letter-spacing:.08em;margin-bottom:4px;color:#8 .teacher{position:fixed;z-index:90;right:0;top:0;bottom:0;width:min(495px,100vw);background:#10253af8;border-left:2px solid #6a899b;box-shadow:-16px 0 70px #0009;overflow:auto;padding:20px 22px 50px;animation:slide .17s ease}.teacher h2{margin:0;font-size:25px}.teacher h3{font-size:19px;margin:14px 0 8px}.teacher-top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-bottom:16px;border-bottom:1px solid #ffffff27}.teacher .mini{font-size:13px;color:#a7c4d6}.teacher-section{padding:12px 0;border-bottom:1px solid #ffffff25}.teacher-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px}.teacher-stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#082034;border:1px solid #36566c;border-radius:12px;padding:12px}.stat strong{display:block;font-size:20px;color:#f4f9ff}.stat span{color:#bad0e0;font-size:13px}.teacher .btn{font-size:14px}.teacher .btn.small{font-size:12px}.event-log{list-style:none;margin:0;padding:0;max-height:210px;overflow:auto}.event-log li{padding:8px 0;border-bottom:1px dashed #38566c;color:#cbd9e7;font-size:13px}.event-log time{color:#8fe0d9;font-weight:800;margin-right:7px}
.overlay{position:fixed;z-index:115;inset:0;background:#03111dea;display:grid;place-items:center;padding:18px}.editor{max-height:95vh;overflow:auto;background:#0f283c;border:1px solid #64839a;box-shadow:0 24px 70px #0008;border-radius:22px;width:min(1080px,100%);padding:23px 26px 30px}.editor-top{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid #476078;padding-bottom:13px;margin-bottom:19px}.editor h2{font-size:26px;margin:0}.editor h3{margin:12px 0}.editor-tools{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0}.stage-list{display:grid;gap:11px}.stage-item{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;background:#092034;border:1px solid #385b74;border-radius:13px;padding:13px 15px}.stage-item strong{font-size:17px}.stage-item span{font-size:13px;color:#b6cfdf;margin-top:4px;display:block}.stage-item .buttons{display:flex;flex-wrap:wrap;gap:6px}.field{display:grid;gap:6px;margin-bottom:14px}.field span{font-size:14px;color:#c6dfed;font-weight:850}.field input,.field textarea,.field select{background:#ebf4fc;color:#132d41;width:100%;border:2px solid #52728a;border-radius:11px;padding:11px 13px;font-size:16px;line-height:1.5}.field textarea{min-height:85px;resize:vertical}.edit-roles{display:grid;grid-template-columns:1fr 1fr;gap:17px}.role-edit{border:1px solid #51758a;border-radius:13px;padding:15px;background:#0a2236}.role-edit h3{margin:0 0 12px}.helper{font-size:13px;color:#b8d0e0;line-height:1.6;margin-top:3px}.section-title{font-weight:900;color:#9be5d8;margin:10px 0 15px}.notice{background:#103a45;border:1px solid #4b8490;border-radius:12px;padding:12px 15px;color:#daf4ee;line-height:1.6;font-size:14px}.display-none{display:none!important}
.pause{position:fixed;z-index:55;inset:0;display:grid;place-items:center;background:#041122ef;text-align:center;padding:20px;backdrop-filter:blur(5px)}.pause h2{font-size:50px;margin:0 0 14px}.pause p{font-size:22px;color:#e1e9f0}.toast{position:fixed;z-index:200;bottom:25px;left:50%;transform:translateX(-50%);background:#fff0bf;color:#1e2c3c;font-weight:900;border-radius:99px;padding:13px 21px;box-shadow:0 15px 45px #0009;max-width:90vw;text-align:center;pointer-events:none}.instructions{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:2px 0 14px;font-size:13px;color:#a6c1d4}.instructions span{background:#142d43;border:1px solid #36566c;border-radius:99px;padding:6px 11px}
@keyframes rise{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}@keyframes slide{from{transform:translateX(20px);opacity:0}to{transform:translateX(0);opacity:1}}@keyframes bounce{to{transform:translateY(-9px)}}
@media(max-width:920px){.app{padding:14px}.header{align-items:flex-start}.brand .logo{width:50px;height:50px;font-size:28px}.header-actions{max-width:220px}.grid{gap:9px}.player-content{padding:13px}.player-heading{padding:12px}.clue{padding:12px}.clue p{font-size:18px}.question{font-size:20px}.choice{font-size:17px}.mission{padding:14px}.edit-roles{grid-template-columns:1fr}}
@media(max-width:660px){.grid{grid-template-columns:1fr}.header{flex-direction:column}.player{min-height:0}.progress-board{flex-wrap:wrap}.round-label{font-size:13px}.welcome{padding:21px}.teacher{width:100vw}}

/* 觸控數字鎖：所有數字題不需鍵盤 */
.numeric-answer{background:#071929;border:2px solid #547990;border-radius:15px;padding:12px;display:grid;gap:10px;max-width:400px;width:100%;align-self:center}.number-display{background:#e8f3fc;color:#122a44;border-radius:12px;text-align:center;min-height:54px;padding:10px;font-size:clamp(24px,2.4vw,34px);font-weight:950;letter-spacing:.12em}.number-display.empty{color:#748a9e;font-size:20px;letter-spacing:0}.numpad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.numkey{touch-action:manipulation;min-height:54px;border-radius:12px;border:1px solid #477087;background:#1d3a55;color:#fff;font-size:24px;font-weight:850}.numkey:active{transform:scale(.97)}.numkey.alt{background:#3f526b;color:#fff1ce;font-size:16px}.number-help{text-align:center;color:#a9c4d8;font-size:13px}@media (max-width:980px){.numeric-answer{padding:8px}.numkey{min-height:48px}.player{min-height:0}.player-content{gap:10px}}
</style>

<body>
<div class="background-glow"></div>
<main class="app" id="app">
  <header class="header">
    <div class="brand"><div class="logo">🔐</div><div><div class="eyebrow">TEAM ESCAPE · TWO PLAYERS</div><h1 id="gameTitle">消失的數學密碼</h1><p id="gameSubtitle">六上第一單元｜雙人合作密室逃脫</p></div></div>
    <div class="header-actions"><button class="btn ghost" id="fullscreenButton" type="button">⛶ 全螢幕</button><button class="btn" id="teacherButton" type="button">⚙ 設定</button></div>
  </header>
  <section class="progress-board" aria-label="關卡進度"><div class="round-pill" id="roundPill">關卡 1 / 4</div><div class="track"><div id="progressFill"></div></div><div class="round-label" id="progressText">0 / 4 道門已開啟</div></section>
  <section class="mission" id="mission"><div class="mission-tags"><span class="mode-pill" id="modeBadge">各自解謎</span><span style="font-size:13px;color:#bcd0e5;font-weight:800">🔐 數學密室逃脫</span></div><h2 id="stageTitle">正在啟動遊戲…</h2><p id="stageStory"></p></section>
  <div class="instructions"><span>👥 左右各一道題</span><span>🔒 兩邊都答對才能開門</span><span>💡 需要幫忙就點「提示」</span></div>
  <section class="grid" id="playerGrid"><article class="player a" id="playerA"></article><article class="player b" id="playerB"></article></section>
  <p class="footnote">數學密室逃脫 · 一起解開所有密碼！</p>
</main>
<div id="startScreen" class="start-screen display-none"></div>
<div id="unlockScreen" class="unlock display-none"></div>
<div id="pauseScreen" class="pause display-none"></div>
<aside id="teacherPanel" class="teacher display-none" aria-label="教師控制面板"></aside>
<div id="editorOverlay" class="overlay display-none"></div>
<div id="toast" class="toast display-none" role="status" aria-live="polite"></div>
<script>
(()=>{'use strict';
const CONFIG_KEY='factor_escape_config_v1',STATE_KEY='factor_escape_state_v1';
const defaults={"title":"消失的數學密碼","subtitle":"六上第一單元｜雙人合作密室逃脫","stages":[{"title":"第一關｜數字雷達站","story":"警報響起！只有找對數字，才能打開第一道門。","mode":"solo","sharedCode":"","a":{"clue":"雷達顯示：17、27、31、39","question":"哪兩個數是質數？","type":"choice","choices":["17、31","17、39","27、31"],"answer":"17、31","hints":["質數只有1和自己兩個因數。","27是3的倍數；39是3的倍數。","17和31都是質數。"]},"b":{"clue":"雷達顯示：23、33、41、49","question":"哪兩個數是合數？","type":"choice","choices":["23、41","33、49","23、49"],"answer":"33、49","hints":["合數除了1和自己，還有其他因數。","33可以除以3；49可以除以7。","33和49都是合數。"]}},{"title":"第二關｜質因數拆解機","story":"前方出現兩台拆解機！找出正確的質因數乘積，機器才會運轉。","mode":"solo","sharedCode":"","a":{"clue":"拆解目標：72","question":"哪一個是72的質因數分解？","type":"choice","choices":["2×2×2×3×3","2×3×12","2×2×18"],"answer":"2×2×2×3×3","hints":["乘積正確還不夠，每個因數都要是質數。","12和18都是合數。","72＝2×2×2×3×3。"]},"b":{"clue":"拆解目標：84","question":"哪一個是84的質因數分解？","type":"choice","choices":["2×3×14","2×2×3×7","4×3×7"],"answer":"2×2×3×7","hints":["每個因數都要是質數。","4和14都不是質數。","84＝2×2×3×7。"]}},{"title":"第三關｜共同因數安全鎖","story":"兩道鎖都缺少最大的共同數字。用短除法解開它們！","mode":"solo","sharedCode":"","a":{"clue":"安全鎖顯示：36 和 54","question":"36和54的最大公因數是多少？","type":"text","choices":[],"answer":"18","hints":["找出兩個數共同的質因數。","兩數可依序共同除以2、3、3。","最大公因數＝2×3×3＝18。"]},"b":{"clue":"安全鎖顯示：42 和 70","question":"42和70的最大公因數是多少？","type":"text","choices":[],"answer":"14","hints":["短除法要除到下方兩數互質。","兩數可以共同除以2和7。","最大公因數＝2×7＝14。"]}},{"title":"第四關｜倍數啟動器","story":"電力還沒恢復！輸入最小公倍數，啟動出口的能源。","mode":"solo","sharedCode":"","a":{"clue":"啟動數字：12 和 15","question":"12和15的最小公倍數是多少？","type":"text","choices":[],"answer":"60","hints":["先用兩數共同的質因數做短除法。","共同除以3後，下方是4和5。","最小公倍數＝3×4×5＝60。"]},"b":{"clue":"啟動數字：14 和 21","question":"14和21的最小公倍數是多少？","type":"text","choices":[],"answer":"42","hints":["除到下方互質，左邊和下方全部相乘。","共同除以7，下方是2和3。","最小公倍數＝7×2×3＝42。"]}},{"title":"終極關｜神祕置物櫃","story":"最後的門上有兩道旋轉數字鎖！兩側的答案都正確，獎盃才會出現。","mode":"coop","sharedCode":"成功解鎖","a":{"clue":"🎁 置物櫃有24枚藍色徽章和36枚金色徽章，要分成內容完全相同的禮物包，全部分完、不剩下。","question":"最多可以分成幾包？","type":"text","choices":[],"answer":"12","hints":["「最多分成幾包」要找最大公因數。","24和36共同質因數是2、2、3。","2×2×3＝12（包）。"]},"b":{"clue":"🚨 密碼燈每8秒閃一次，警示燈每12秒閃一次。兩盞燈現在同時閃爍。","question":"至少再過幾秒，兩盞燈會再次同時閃？","type":"text","choices":[],"answer":"24","hints":["「再次同時閃」要找最小公倍數。","8＝2×2×2；12＝2×2×3。","最小公倍數＝24（秒）。"]}}]};
const el=id=>document.getElementById(id);const clone=v=>JSON.parse(JSON.stringify(v));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

config.stages[editIndex]=s;configChanged('第 '+(editIndex+1)+' 關已更新，進度重設');editorSubmode='list';renderEditor()}
function exportConfig(){const blob=new Blob([JSON.stringify({...config,exportedAt:new Date().toISOString()},null,2)],{type:'application/json;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='雙人密室逃脫_題庫_'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);toast('題庫 JSON 已匯出，請妥善保存')}
async function importConfig(file){if(!file)return;try{const raw=JSON.parse(await file.text());const incoming=validateConfig(raw);for(const s of incoming.stages){for(const p of ['a','b']){if(!s[p].answer)throw Error('有關卡缺少正確答案')}}if(!confirm(`確定匯入「${incoming.title}」共 ${incoming.stages.length} 關？目前的自訂題庫和遊戲進度將被取代。`))return;config=incoming;configChanged('已匯入新題庫');if(editorOpen)renderEditor()}catch(e){alert('匯入失敗：'+e.message)}}
function printCards(){const cards=config.stages.map((s,j)=>`<div class="section"><h2>第 ${j+1} 關：${esc(s.title)}　<small>${s.mode==='coop'?'合作情報關':'各自解答關'}</small></h2><p>${esc(s.story)}</p><div class="columns">${['a','b'].map(p=>{const d=s[p];return `<div><h3>隊員 ${p.toUpperCase()}</h3><p><b>線索：</b>${nl(d.clue)}</p><p><b>題目：</b>${nl(d.question)}</p>${d.hints.map((h,i)=>`<div class="card"><small>✂ 裁切線 · ${p.toUpperCase()} 提示卡 ${i+1}</small><p>${nl(h)}</p></div>`).join('')}<div class="answer"><b>教師答案：</b>${esc(d.answer)}</div></div>`}).join('')}</div>${s.sharedCode?`<p><b>共同密碼：</b>${esc(s.sharedCode)}</p>`:''}</div>`).join('');const html=`<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><title>教師提示卡與解答｜${esc(config.title)}</title><style>body{font-family:Arial,'Microsoft JhengHei',sans-serif;color:#172533;padding:22px}h1{color:#214a58}.section{border-bottom:2px solid #526d76;margin-bottom:22px;break-inside:avoid;padding-bottom:12px}.columns{display:grid;grid-template-columns:1fr 1fr;gap:22px}.card{border:2px dashed #777;padding:10px;margin:12px 0;min-height:65px;break-inside:avoid;background:#fffbe7}.card small{color:#825c16}.card p{font-weight:bold;font-size:17px}.answer{color:#ad3434;background:#fff0f0;padding:9px}h2{font-size:19px}h3{font-size:16px}p{line-height:1.6}@page{size:A4;margin:12mm}@media print{body{padding:0}}
/* 觸控數字鎖：所有數字題不需鍵盤 */
.numeric-answer{background:#071929;border:2px solid #547990;border-radius:15px;padding:12px;display:grid;gap:10px;max-width:400px;width:100%;align-self:center}.number-display{background:#e8f3fc;color:#122a44;border-radius:12px;text-align:center;min-height:54px;padding:10px;font-size:clamp(24px,2.4vw,34px);font-weight:950;letter-spacing:.12em}.number-display.empty{color:#748a9e;font-size:20px;letter-spacing:0}.numpad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.numkey{touch-action:manipulation;min-height:54px;border-radius:12px;border:1px solid #477087;background:#1d3a55;color:#fff;font-size:24px;font-weight:850}.numkey:active{transform:scale(.97)}.numkey.alt{background:#3f526b;color:#fff1ce;font-size:16px}.number-help{text-align:center;color:#a9c4d8;font-size:13px}@media (max-width:980px){.numeric-answer{padding:8px}.numkey{min-height:48px}.player{min-height:0}.player-content{gap:10px}}
</style></head><body><h1>💡 ${esc(config.title)}｜教師提示卡與答案</h1><p>每張虛線卡可以剪下，分階段發給學生；紅色「教師答案」請留在老師手上。</p>${cards}<button onclick="window.print()">🖨 列印提示卡</button></body></html>`;const w=window.open('','_blank');if(!w){toast('瀏覽器擋住新視窗，請允許彈出視窗後重試');return}w.document.write(html);w.document.close();w.focus()}
function toggleFullscreen(){if(!document.fullscreenElement){document.documentElement.requestFullscreen?.().catch(()=>toast('無法進入全螢幕，請改按 F11'))}else document.exitFullscreen?.()}
// All clicks are delegated so that regenerated panels stay interactive.
document.addEventListener('click',e=>{const t=e.target.closest('[data-numpad],[data-choose],[data-submit],[data-request],[data-start],[data-edit],[data-close-editor],[data-close-teacher],[data-teacher],[data-next],[data-resume],[data-pause],[data-hint],[data-skip],[data-prev],[data-restart],[data-add-stage],[data-edit-stage],[data-duplicate],[data-delete],[data-move],[data-back-editor],[data-save-global],[data-export],[data-print]');if(!t)return;const d=t.dataset;
if(d.numpad!==undefined){const i=+d.numpad,k=d.key;if(state.paused||unlockShowing||state.solved[i])return;const v=state.drafts[i]||'';state.drafts[i]=k==='清除'?'':k==='⌫'?v.slice(0,-1):(v.length<5?v+k:v);renderPlayer(i);save();return}
 if(d.choose!==undefined){if(state.paused||unlockShowing||state.solved[+d.choose])return;const i=+d.choose;state.drafts[i]=stage()[i?'b':'a'].choices[+d.choiceIndex];renderPlayer(i);save();return}
if(d.submit!==undefined)return submit(+d.submit);
if(d.request!==undefined)return giveHint(+d.request);
if(d.start!==undefined){state.started=true;state.startedAt=Date.now();log('🚩 開始挑戰');render();toast('挑戰開始，祝解謎成功！');return}
if(d.edit!==undefined)return openEditor();if(d.closeEditor!==undefined)return closeEditor();if(d.closeTeacher!==undefined){teacherOpen=false;renderTeacher();return}if(d.teacher!==undefined)return openTeacher();if(d.next!==undefined)return nextStage();if(d.resume!==undefined){state.paused=false;renderPause();renderTeacher();save();return}if(d.pause!==undefined)return switchPause();if(d.hint!==undefined)return giveHint(+d.hint);if(d.skip!==undefined)return skipStage();if(d.prev!==undefined)return prevStage();if(d.restart!==undefined)return restart();if(d.backEditor!==undefined){editorSubmode='list';renderEditor();return}if(d.addStage!==undefined){if(config.stages.length>=60){toast('最多可新增 60 關');return}config.stages.push({title:'新關卡｜請修改標題',story:'生活情境描述：請幫忙解開大門。',mode:'solo',sharedCode:'',a:{clue:'請放入 A 的線索',question:'請填入 A 的問題',type:'text',choices:[],answer:'1',hints:['先看題目提示','試著列出重點','答案是 1']},b:{clue:'請放入 B 的線索',question:'請填入 B 的問題',type:'text',choices:[],answer:'2',hints:['先看題目提示','試著列出重點','答案是 2']}});editIndex=config.stages.length-1;configChanged('已新增關卡，請編輯內容');editorSubmode='stage';renderEditor();return}
if(d.editStage!==undefined){editIndex=+d.editStage;editorSubmode='stage';renderEditor();return}if(d.duplicate!==undefined){if(config.stages.length>=60){toast('最多 60 關');return}const i=+d.duplicate;config.stages.splice(i+1,0,clone(config.stages[i]));configChanged('已複製關卡');renderEditor();return}if(d.delete!==undefined){const i=+d.delete;if(!confirm(`確定要刪除「${config.stages[i].title}」嗎？`))return;config.stages.splice(i,1);configChanged('關卡已刪除');renderEditor();return}if(d.move!==undefined){const [i,delta]=d.move.split(',').map(Number),j=i+delta;if(j>=0&&j<config.stages.length){[config.stages[i],config.stages[j]]=[config.stages[j],config.stages[i]];configChanged('關卡順序已調整');renderEditor()}return}if(d.saveGlobal!==undefined){const title=el('ed_title')?.value?.trim(),subtitle=el('ed_subtitle')?.value?.trim();if(title)config.title=title;if(subtitle)config.subtitle=subtitle;save();render();toast('遊戲名稱已儲存');return}if(d.export!==undefined)return exportConfig();if(d.print!==undefined)return printCards();});
document.addEventListener('input',e=>{if(e.target.matches('[data-draft]')){state.drafts[+e.target.dataset.draft]=e.target.value;save()}});
document.addEventListener('submit',e=>{if(e.target.id==='stageForm'){e.preventDefault();saveStage(e.target)}});
document.addEventListener('change',e=>{if(e.target.id==='importFile'){importConfig(e.target.files?.[0]);e.target.value=''}});
el('teacherButton').addEventListener('click',()=>{teacherOpen=!teacherOpen;renderTeacher()});el('fullscreenButton').addEventListener('click',toggleFullscreen);
document.addEventListener('keydown',e=>{const typing=e.target instanceof HTMLElement&&(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)||e.target.isContentEditable);if(e.altKey&&['1','2','p','P'].includes(e.key)){e.preventDefault();if(e.key==='1')giveHint(0);else if(e.key==='2')giveHint(1);else switchPause();return}if(e.key.toLowerCase()==='t'&&!e.ctrlKey&&!e.metaKey&&!typing){teacherOpen=!teacherOpen;renderTeacher();return}if(e.key==='Escape'&&editorOpen){closeEditor();return}if(e.key==='Enter'&&!typing){const focus=e.target.closest('.player');if(focus)submit(focus.id==='playerA'?0:1)}if(e.key==='Enter'&&typing&&e.target.matches('[data-draft]')){e.preventDefault();submit(+e.target.dataset.draft)}});
if(state.finished){state.started=true;render();showFinal()}else if(state.solved.every(Boolean)&&state.started){render();showUnlock()}else render();
})();
</script>
</body>
